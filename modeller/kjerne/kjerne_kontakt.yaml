id: https://example.org/modeller/kjerne_kontakt
name: kjerne_kontakt
title: Kjerne – kontakt og ansvar
description: Kontaktpunkt og utgiver, slik DCAT-AP-NO og SKOS-AP-NO bruker dem.
version: 1.0.0
status: linkml:testing
annotations:
  lag: kjerne
  eier: Seksjon for informasjonsforvaltning

prefixes:
  linkml: https://w3id.org/linkml/
  kjerne: https://example.org/modeller/kjerne/
  dct: http://purl.org/dc/terms/
  dcat: http://www.w3.org/ns/dcat#
  vcard: http://www.w3.org/2006/vcard/ns#

default_prefix: kjerne
default_range: string

imports:
  - linkml:types
  - kjerne_typer

classes:

  Kontaktpunkt:
    class_uri: vcard:Organization
    description: >-
      Kontaktinformasjon for en funksjon, f.eks. en avdeling eller felles
      postkasse. Skal ikke peke til en enkeltperson.
    slots: [organisasjonsnavn, epost, telefon, kontaktside]

slots:

  kontaktpunkt:
    slot_uri: dcat:contactPoint
    range: Kontaktpunkt
    multivalued: true
    inlined_as_list: true
  utgiver:
    slot_uri: dct:publisher
    range: uriorcurie
    description: URI til virksomheten, helst fra Enhetsregisteret.
  organisasjonsnavn:
    slot_uri: vcard:hasOrganizationName
    range: TekstEnPerSprak
    inlined: true
  epost:
    slot_uri: vcard:hasEmail
    range: uri
    pattern: "^mailto:.+@.+$"
  telefon:
    slot_uri: vcard:hasTelephone
    range: uri
    pattern: "^tel:\\+?[0-9]+$"
  kontaktside:
    slot_uri: vcard:hasURL
    range: uri
